<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150" role="img" aria-label="Chess Coach — every move graded by Stockfish 19, running in your browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d0e"/>
      <stop offset="0.55" stop-color="#121517"/>
      <stop offset="1" stop-color="#0b0d0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97c2f"/>
      <stop offset="0.5" stop-color="#e8c877"/>
      <stop offset="1" stop-color="#a97c2f"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1c2124"/>
      <stop offset="0.62" stop-color="#0b0d0e"/>
    </radialGradient>
    <linearGradient id="evbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd6d0"/>
    </linearGradient>
  </defs>

  <rect width="820" height="150" fill="url(#bg)"/>
  <rect width="820" height="150" fill="url(#spot)" opacity="0.9"/>
  <rect x="0.5" y="0.5" width="819" height="149" fill="none" stroke="#232a2d"/>

  <!-- ===== left: 4x4 mini board, ambient game loop ===== -->
  <g transform="translate(56,25)">
    <rect x="-8" y="-8" width="120" height="120" rx="10" fill="#2c3438"/>
    <!-- eval tube (left of squares, inside frame) -->
    <g transform="translate(-2,0)">
      <rect x="0" y="0" width="8" height="104" rx="4" fill="#101315" stroke="#2c3438" stroke-width="0.5"/>
      <rect x="1.5" y="2" width="5" height="96" rx="2.5" fill="url(#evbar)">
        <animate attributeName="height" values="96;58;74;58;96" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.5;0.7;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        <animate attributeName="y" values="2;40;24;40;2" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.3;0.5;0.7;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </rect>
    </g>
    <!-- squares: 4x4, 26px each, origin (14,0) -->
    <g transform="translate(14,0)">
      <rect x="0" y="0"   width="26" height="26" fill="#1e2325"/><rect x="26" y="0"  width="26" height="26" fill="#333a3d"/><rect x="52" y="0" width="26" height="26" fill="#1e2325"/><rect x="78" y="0" width="26" height="26" fill="#333a3d"/>
      <rect x="0" y="26"  width="26" height="26" fill="#333a3d"/><rect x="26" y="26" width="26" height="26" fill="#1e2325"/><rect x="52" y="26" width="26" height="26" fill="#333a3d"/><rect x="78" y="26" width="26" height="26" fill="#1e2325"/>
      <rect x="0" y="52"  width="26" height="26" fill="#1e2325"/><rect x="26" y="52" width="26" height="26" fill="#333a3d"/><rect x="52" y="52" width="26" height="26" fill="#1e2325"/><rect x="78" y="52" width="26" height="26" fill="#333a3d"/>
      <rect x="0" y="78"  width="26" height="26" fill="#333a3d"/><rect x="26" y="78" width="26" height="26" fill="#1e2325"/><rect x="52" y="78" width="26" height="26" fill="#333a3d"/><rect x="78" y="78" width="26" height="26" fill="#1e2325"/>

      <!-- white pawn, col b (x 39), row 3 (y 78..104) -> hops two squares up -->
      <g>
        <ellipse cx="39" cy="99" rx="6.5" ry="2.8" fill="#eef1ec" stroke="#1c2026" stroke-width="1.4"/>
        <path d="M33.5 97.5 h11 l-2.5 -6 h-6 z" fill="#eef1ec" stroke="#1c2026" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="39" cy="87.5" r="4.4" fill="#eef1ec" stroke="#1c2026" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -52;0 -52;0 0;0 0" keyTimes="0;0.02;0.13;0.8;0.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.3 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"/>
      </g>

      <!-- black pawn, col c (x 65), row 0 (y 0..26) -> replies two squares down -->
      <g>
        <circle cx="65" cy="16.5" r="4.4" fill="#23272e" stroke="#f0f4f8" stroke-width="1.4"/>
        <path d="M59.5 22.5 h11 l-2.5 6 h-6 z" fill="#23272e" stroke="#f0f4f8" stroke-width="1.4" stroke-linejoin="round"/>
        <ellipse cx="65" cy="31" rx="6.5" ry="2.8" fill="#23272e" stroke="#f0f4f8" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 52;0 52;0 0;0 0" keyTimes="0;0.13;0.26;0.8;0.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.3 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"/>
      </g>

      <!-- white knight, col d (x 91), row 3 -> hops diagonally to col c row 1 -->
      <g>
        <path d="M84 101c0-7 1.8-9.8 5-12.6l2.6-2.2c2.7-2.4 4-4.9 4-8.1 0-4.9-3.9-8.8-8.8-8.8-1.2 0-2.3.2-3.3.7l-2.8-1.3c-.9-.4-1.9.1-2.1 1.1l-.7 4.4c-.2.9.1 1.8.9 2.3l3 2.3-3.3 4.7c-1.7 2.2-2.5 4.9-2.5 7.6v9.9z"
              fill="#eef1ec" stroke="#1c2026" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="86.2" cy="80.6" r="1" fill="#1c2026"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-26 -26;-26 -26;0 0;0 0" keyTimes="0;0.34;0.48;0.8;0.9;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.3 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"/>
      </g>

      <!-- Best-move badge pops on the knight's landing square (col c, row 1 → center 65,39) -->
      <g transform="translate(65,39)">
        <g opacity="0">
          <circle r="11.5" fill="#3ecf8e"/>
          <text y="4.4" text-anchor="middle" font-family="Consolas, 'Segoe UI', monospace" font-size="13" font-weight="700" fill="#0b0d0e">★</text>
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.55;0.78;0.86;1" dur="8s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== right: wordmark + tagline + verdict chips ===== -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <text x="212" y="62" font-size="42" font-weight="650" fill="#eef1ec" letter-spacing="0.5">Chess <tspan fill="url(#gold)">Coach</tspan></text>
    <text x="215" y="89" font-size="14.5" fill="#8b958e">Every move graded — by Stockfish 19 running in your browser.</text>

    <g font-family="Consolas, monospace" font-size="12.5" font-weight="700">
      <g>
        <rect x="215" y="102" width="104" height="23" rx="11.5" fill="#ff6a5a" opacity="0.14" stroke="#ff6a5a" stroke-opacity="0.55"/>
        <text x="232" y="117.5" fill="#ff6a5a">?? BLUNDER</text>
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.2;0.28;0.9;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="215" y="102" width="118" height="23" rx="11.5" fill="#f2b04a" opacity="0.14" stroke="#f2b04a" stroke-opacity="0.55"/>
        <text x="232" y="117.5" fill="#f2b04a">?! INACCURACY</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.36;0.6;0.68;1" dur="9s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <rect x="215" y="102" width="116" height="23" rx="11.5" fill="#42d5a0" opacity="0.14" stroke="#42d5a0" stroke-opacity="0.55"/>
        <text x="232" y="117.5" fill="#42d5a0">!! BRILLIANT</text>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.76;0.9;0.98;1" dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="36" y="142" width="748" height="2" rx="1" fill="url(#gold)" opacity="0.25"/>
</svg>
